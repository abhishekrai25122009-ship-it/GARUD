<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <linearGradient id="gGold" x1="40" y1="22" x2="60" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="gEye" x1="34" y1="21" x2="42" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gSlate" x1="10" y1="10" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="gMid" x1="16" y1="12" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gWhite" x1="20" y1="6" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  {/* Background Shield Octagon */}
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16" fill="#04080e" stroke="#00f0ff" stroke-width="2" />
  <polygon points="32,7 53,18 53,46 32,57 11,46 11,18" fill="none" stroke="#1e3a5f" stroke-width="1" />

  {/* Swept Feathers */}
  <polygon points="10,48 24,47 28,55 18,57" fill="url(#gSlate)" stroke="#1e293b" stroke-width="0.8" />
  <polygon points="6,38 22,37 28,45 14,47" fill="url(#gSlate)" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />
  <polygon points="4,28 24,26 31,37 12,38" fill="url(#gMid)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7" />
  <polygon points="8,19 28,17 33,26 14,27" fill="url(#gMid)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />

  {/* Top Crest Feathers */}
  <polygon points="14,10 32,10 36,18 20,18" fill="url(#gWhite)" stroke="#f8fafc" stroke-width="1" />
  <polygon points="22,5 37,9 41,16 28,15" fill="url(#gWhite)" stroke="#00f0ff" stroke-width="0.8" />

  {/* Main Head & Throat Body */}
  <polygon points="27,15 42,16 45,23 38,36 26,45 23,32" fill="url(#gSlate)" stroke="#0f172a" stroke-width="1.2" />
  <polygon points="38,36 43,38 38,50 26,56 25,44" fill="url(#gMid)" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6" />
  <polygon points="38,36 44,37 41,43 36,43" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />

  {/* Hooked Beak */}
  <path d="M42,21 L48,22 C53,23 58,26 60,31 C61.5,34.5 59.5,39 56.5,41.5 C55,42.8 53.5,42 54.5,39 C55.5,36 54,34 50,33.5 L42,33 Z" fill="url(#gGold)" stroke="#f59e0b" stroke-width="1" stroke-linejoin="round" />
  <path d="M43,21.5 C48,22.5 53,24.5 57,28 C59.5,30.5 60.5,33.5 59.8,36.5 C59.2,38.5 58,40.5 56.5,41.5 C55.8,42 55,41 55.4,39.5 C56.5,36 55.5,33.5 51,32.5 L43,32.2" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="42,33.5 50,34 46,38 41,36" fill="#b45309" stroke="#78350f" stroke-width="0.6" />

  {/* Brow Ridge */}
  <polygon points="31,19 44,20 46,23.5 39,23.5 33,22" fill="#020408" stroke="#00f0ff" stroke-width="0.8" />
  <line x1="32" y1="20" x2="45" y2="21.5" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />

  {/* Predator Eye */}
  <polygon points="34,22.5 43,23.2 41.5,27.5 35,26.5" fill="#05080f" />
  <path d="M35,24 C38,22.8 40.5,23.2 42.5,24.8 C41,27 38.5,27.2 35.8,25.8 Z" fill="url(#gEye)" stroke="#fbbf24" stroke-width="0.5" />
  <ellipse cx="38.5" cy="24.8" rx="1.6" ry="1.3" fill="#04060a" />
  <circle cx="39.2" cy="24.4" r="0.8" fill="#00f0ff" filter="url(#fGlow)" />
  <circle cx="39.2" cy="24.4" r="0.4" fill="#ffffff" />

  {/* Accent Lines */}
  <path d="M33,28 L40,29.5 L36,34" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="28" y1="40" x2="35" y2="42" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <path d="M8,28 L23,27 L18,34" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.75" />
</svg>
